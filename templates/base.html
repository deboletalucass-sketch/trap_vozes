<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Configurações -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título -->
    <title>
        {{ titulo }} | {{ site.titulo }}
    </title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- ========================================= -->
    <!-- PAINÉIS LATERAIS (identidade visual de exposição) -->
    <!-- ========================================= -->

    <div class="side-deco left">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <span class="side-label">TRAP VOZES</span>
    </div>

    <div class="side-deco right">
        <span class="side-label">{{ site.subtitulo }}</span>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <!-- ========================================= -->
    <!-- CABEÇALHO -->
    <!-- ========================================= -->

    <header>

        <nav class="navbar navbar-expand-lg navbar-dark shadow">

            <div class="container">

                <!-- Logo -->

                <a class="navbar-brand logo" href="/">

                    <i class="bi bi-music-note-beamed"></i>

                    {{ site.titulo }}

                </a>

                <!-- Botão Mobile -->

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- Menu -->

                <div class="collapse navbar-collapse" id="menu">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="/">
                                Início
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/sobre">
                                Sobre
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/artistas">
                                Artistas
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/analises">
                                Análises
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/referencias">
                                Referências
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/equipe">
                                Equipe
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

    <!-- ========================================= -->
    <!-- CONTEÚDO -->
    <!-- ========================================= -->

    <main>

        {% block content %}

        {% endblock %}

    </main>

    <!-- ========================================= -->
    <!-- RODAPÉ -->
    <!-- ========================================= -->

    <footer>

        <div class="container">

            <p>

                {{ site.titulo }}

                © {{ site.ano }}

            </p>

            <p>

                Instituto Federal do Paraná

            </p>

        </div>

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
